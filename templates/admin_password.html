{% extends "base.html" %}
{% block title %}Password{% endblock %}
{% block content %}
<div class="page-heading">
  <div>
    <h1>Password</h1>
    <p class="muted">Reset admin or student passwords from one place.</p>
  </div>
</div>

<div class="card narrow password-card">
  <div class="radio-group">
    <label class="radio-option">
      <input type="radio" name="password_target" value="student">
      <span>Reset Student Password</span>
    </label>
    <label class="radio-option">
      <input type="radio" name="password_target" value="admin" checked>
      <span>Reset Admin Password</span>
    </label>
  </div>

  <form method="post" class="compact-form password-reset-form" data-target="admin">
    <input type="hidden" name="target" value="admin">
    <label>Admin Email</label>
    <input type="email" name="email" value="admin@ayu.com" maxlength="255" autocomplete="email" required>

    <label>New Password</label>
    <input type="password" name="new_password" required>

    <label>Confirm New Password</label>
    <input type="password" name="confirm_password" required>

    <button type="submit">Update Admin Password</button>
  </form>

  <form method="post" class="compact-form password-reset-form is-hidden" data-target="student">
    <input type="hidden" name="target" value="student">
    <label>Student Email</label>
    <input type="email" name="email" maxlength="255" autocomplete="email" required>

    <label>New Password</label>
    <input type="password" name="new_password" required>

    <label>Confirm New Password</label>
    <input type="password" name="confirm_password" required>

    <button type="submit">Update Student Password</button>
  </form>
</div>

<script>
  const passwordOptions = document.querySelectorAll('input[name="password_target"]');
  const passwordForms = document.querySelectorAll('.password-reset-form');

  passwordOptions.forEach((option) => {
    option.addEventListener('change', () => {
      passwordForms.forEach((form) => {
        const isSelected = form.dataset.target === option.value;
        form.classList.toggle('is-hidden', !isSelected);
        form.querySelectorAll('input:not([type="hidden"])').forEach((input) => {
          input.disabled = !isSelected;
        });
      });
    });
  });
</script>
{% endblock %}
